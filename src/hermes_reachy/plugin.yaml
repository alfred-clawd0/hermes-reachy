name: reachy-platform
label: Reachy
kind: platform
version: 0.2.0
description: >
  Reachy Mini robot platform + body tool for Hermes Agent. Runs a WebSocket server that the
  robot's voice app connects to as a client: inbound STT-text frames become messages (the app
  owns mic/STT/VAD); outbound agent text is streamed as "say" frames the app renders through
  its own TTS pipeline. Because the WebSocket persists, async/background/cron delivery reaches
  the robot natively. Every connection must authenticate with a shared API key in its first
  "hello" frame. Also registers the `reachy_body` tool (emote / dance / look / stop /
  head_tracking / chirp), executed with a client-side allowlist on the robot.
author: ai-ag2026
# An API key is REQUIRED: set REACHY_WS_API_KEY, or REACHY_WS_API_KEY_FILE instead (the inline key
# wins when both are set). Both are listed under optional_env on purpose: Hermes checks every
# requires_env name literally, so listing either one would report a setup that uses the other as
# incomplete. The gateway's validate_config refuses to start the platform, with the reason in its
# log, when neither yields a usable key.
requires_env:
  - name: REACHY_WS_PORT
    description: "WebSocket server listen port (the robot voice app connects here)"
    prompt: "Reachy WebSocket listen port (e.g. 8770)"
    password: false
optional_env:
  - name: REACHY_WS_API_KEY
    description: "Shared secret the voice app sends as api_key in its first hello frame (this or REACHY_WS_API_KEY_FILE is required)"
    prompt: "Reachy WebSocket API key (or empty to use REACHY_WS_API_KEY_FILE)"
    password: true
    secret: true
  - name: REACHY_WS_API_KEY_FILE
    description: "Path to a file holding the API key (this or REACHY_WS_API_KEY is required)"
    prompt: "Reachy WebSocket API key file (or empty)"
    password: false
  - name: REACHY_WS_HOST
    description: "Bind address (default: 127.0.0.1). Use 0.0.0.0 only if the voice app runs on another machine — ws:// sends the key in plaintext"
    prompt: "Bind host (default: 127.0.0.1)"
    password: false
  - name: REACHY_ALLOWED_ROBOTS
    description: "Comma-separated robot ids allowed to connect (unset or empty = reachy)"
    prompt: "Allowed robot ids (comma-separated; empty = reachy)"
    password: false
  - name: REACHY_ALLOW_ALL_ROBOTS
    description: "Dev only: accept any robot id (the API key is still required)"
    prompt: "Allow all robot ids? (true/false)"
    password: false
  - name: REACHY_HOME_CHANNEL
    description: "Default robot id for cron / notification (send_message, proactive) delivery"
    prompt: "Home robot id (or empty)"
    password: false
